name: Release

# Push a tag such as v4.6 (the same number as the VERSION file) and this builds the
# download ZIPs, a SHA-256 checksum for the updater, and publishes the release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the VERSION file
        shell: powershell
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ("v$v" -ne $env:GITHUB_REF_NAME) {
            Write-Host "Tag $($env:GITHUB_REF_NAME) does not match VERSION $v"
            exit 1
          }

      - name: Repository checks
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\Test-Repo.ps1

      - name: Build ZIPs and checksum
        shell: powershell
        run: |
          $tag = $env:GITHUB_REF_NAME
          git archive --format=zip --prefix="win11-optimizer-$tag/" -o "win11-optimizer-$tag.zip" HEAD
          # the Windows app: built here from the app folder, added to the ZIP next to the other files
          powershell -NoProfile -ExecutionPolicy Bypass -File app\build.ps1 -Out "$PWD\appout\Win11 Optimizer.exe"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::Open("$PWD\win11-optimizer-$tag.zip", 'Update')
          [void][IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, "$PWD\appout\Win11 Optimizer.exe", "win11-optimizer-$tag/Win11 Optimizer.exe")
          $zip.Dispose()
          Copy-Item "win11-optimizer-$tag.zip" win11-optimizer.zip
          $h = (Get-FileHash win11-optimizer.zip -Algorithm SHA256).Hash.ToLower()
          "$h  win11-optimizer.zip" | Out-File -FilePath win11-optimizer.zip.sha256 -Encoding ascii

      - name: Release notes from CHANGELOG
        shell: powershell
        run: |
          $tag = $env:GITHUB_REF_NAME
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, '(?ms)^## ' + [regex]::Escape($tag) + '\s*\r?\n(.*?)(?=^## |\z)')
          $body = $m.Groups[1].Value.Trim()
          if ($body -eq '') { $body = 'See CHANGELOG.md' }
          $footer = "`n`nUse at your own risk. Windows 11, run the main menu as administrator, keep all folders together and read page 1 of the manual first. To update an existing install, press U in the main menu."
          [IO.File]::WriteAllText((Join-Path $PWD.Path 'notes.md'), ($body + $footer), (New-Object System.Text.UTF8Encoding($false)))

      - name: Publish
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          # A file named BETA in the repository root marks a pre-release: it is not "latest", so the updater (U) keeps offering the last stable version.
          $mark = '--latest'
          if (Test-Path BETA) { $mark = '--prerelease' }
          gh release create $tag "win11-optimizer-$tag.zip" win11-optimizer.zip win11-optimizer.zip.sha256 --title $tag --notes-file notes.md $mark
