name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repository checks (version, syntax, labels, undo files, Check Status dry run)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\Test-Repo.ps1

      - name: Lint PowerShell (PSScriptAnalyzer, errors and warnings)
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost,PSUseApprovedVerbs,PSAvoidUsingEmptyCatchBlock,PSUseShouldProcessForStateChangingFunctions,PSAvoidGlobalVars,PSUseSingularNouns,PSAvoidUsingInvokeExpression,PSUseDeclaredVarsMoreThanAssignments,PSReviewUnusedParameter,PSUseBOMForUnicodeEncodedFile
          $r | Format-Table RuleName,Severity,ScriptName,Line,Message -AutoSize -Wrap | Out-String -Width 220
          Write-Host ('findings: ' + @($r).Count)

      - name: Read-only tools run without errors
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Env_Check.ps1 -Human
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\System_Report.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Driver scan runs (scan only, nothing is installed)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Driver_Check.ps1 -SkipUpdateSearch -NoPrompt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Driver cleanup scan runs (list only, nothing is removed)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Driver_Clean.ps1 -NoPrompt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: PC specs page runs (read-only)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\PC_Specs.ps1 -Root .
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: PC health and support bundle run (read-only)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\PC_Health.ps1 -Root .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Support_Bundle.ps1 -Root .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $b = Get-ChildItem -Path 'Logs' -Filter 'SupportBundle_*.txt' | Select-Object -First 1
          if ($null -eq $b) { Write-Host 'no bundle was written'; exit 1 }
          $t = [IO.File]::ReadAllText($b.FullName)
          foreach ($s in '## Environment', '## Check Status', '## PC specs', '## PC health', '## System report', '## Driver scan') { if (-not $t.Contains($s)) { Write-Host ('missing section ' + $s); exit 1 } }
          if ($t -match [regex]::Escape($env:USERNAME + '\') -or $t.Contains($env:COMPUTERNAME)) { Write-Host 'the bundle still contains the user or computer name'; exit 1 }
          Write-Host ('bundle ok, ' + [math]::Round($b.Length / 1KB) + ' KB')

      - name: Cleanup summary runs (list only, nothing is removed)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Clean_Up.ps1 -NoPrompt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path 'Logs')) { Write-Host 'the tools did not create a Logs folder'; exit 1 }
          if (@(Get-ChildItem -File -Filter '*_*.txt' | Where-Object { $_.Name -match '^(CheckReport|NetworkTest|SystemReport|DriverReport|PCHealth|PCSpecs|SupportBundle)_' }).Count -gt 0) { Write-Host 'a tool still saved a report next to the scripts'; exit 1 }

      - name: Updater install step (success, overwrite, roll back)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\Test-UpdateApply.ps1

      - name: Apply and undo every tweak on this disposable machine
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\Test-RegRoundTrip.ps1

      - name: Main menu starts, revert path works, menu exits
        shell: cmd
        timeout-minutes: 3
        run: |
          call "1_Start_Here - PC_Optimizer_Master (Run as Administrator).bat" < tests\master_input.txt > master_out.txt 2>&1
          type master_out.txt
          findstr /c:"MASTER CONTROL v" master_out.txt
          if errorlevel 1 exit /b 1
          findstr /c:"Reverting with UNDO_15" master_out.txt
          if errorlevel 1 exit /b 1
          findstr /c:"PC HEALTH" master_out.txt
          if errorlevel 1 exit /b 1
          findstr /c:"SUPPORT BUNDLE" master_out.txt
          if errorlevel 1 exit /b 1
          findstr /c:"YOUR PC ON ONE PAGE" master_out.txt
          if errorlevel 1 exit /b 1

      - name: Show what the main menu printed
        if: always()
        shell: cmd
        run: if exist master_out.txt type master_out.txt

      - name: Easy Setup settings step (/easy games) on this disposable machine
        shell: cmd
        timeout-minutes: 8
        run: |
          call "1_Start_Here - PC_Optimizer_Master (Run as Administrator).bat" /easy games > easy_out.txt 2>&1 < nul
          type easy_out.txt
          findstr /c:"The settings step is finished" easy_out.txt
          if errorlevel 1 exit /b 1

      - name: The Easy Setup settings are in place (read-only check)
        shell: powershell
        run: |
          $root = (Get-Location).Path
          $items = & { . (Join-Path $root 'tools\Check_Status.ps1') -Root $root; Invoke-Checks (Join-Path $root 'reg') (Join-Path $env:TEMP 'pcopt_ci_unused'); $script:Items }
          $ok = @($items | Where-Object { $_.Status -eq 'OK' }).Count
          Write-Host ('settings OK after /easy games: ' + $ok)
          foreach ($i in $items) { Write-Host ('  [' + $i.Status + '] ' + $i.Id + ' ' + $i.Title) }
          if ($ok -lt 15) { Write-Host 'too few settings are in place'; exit 1 }

      - name: Show what the Easy Setup settings step printed
        if: always()
        shell: cmd
        run: if exist easy_out.txt type easy_out.txt

      - name: Easy Setup Maximum (/easy max) on this disposable machine
        shell: cmd
        timeout-minutes: 8
        run: |
          call "1_Start_Here - PC_Optimizer_Master (Run as Administrator).bat" /easy max > easy_max_out.txt 2>&1 < nul
          type easy_max_out.txt
          findstr /c:"The settings step is finished" easy_max_out.txt
          if errorlevel 1 exit /b 1

      - name: Maximum applied every optional tweak except Memory Integrity (read-only check)
        shell: powershell
        run: |
          $root = (Get-Location).Path
          $items = & { . (Join-Path $root 'tools\Check_Status.ps1') -Root $root; Invoke-Checks (Join-Path $root 'reg') (Join-Path $env:TEMP 'pcopt_ci_unused_max'); $script:Items }
          $bad = @()
          foreach ($id in '09', '10', '11', '12', '15') { $i = @($items | Where-Object { $_.Id -eq $id }) | Select-Object -First 1; Write-Host ($id + ': ' + $i.Status); if ($null -eq $i -or $i.Status -ne 'OK') { $bad += $id } }
          $i13 = @($items | Where-Object { $_.Id -eq '13' }) | Select-Object -First 1
          Write-Host ('13: ' + $i13.Status + ' (must NOT be applied by max)')
          if ($null -ne $i13 -and $i13.Status -eq 'OK') { $bad += '13 was applied without max13' }
          if ($bad.Count -gt 0) { Write-Host ('problem: ' + ($bad -join ', ')); exit 1 }

      - name: Easy Setup Maximum with Memory Integrity off (/easy max13) on this disposable machine
        shell: cmd
        timeout-minutes: 8
        run: |
          call "1_Start_Here - PC_Optimizer_Master (Run as Administrator).bat" /easy max13 > easy_max13_out.txt 2>&1 < nul
          type easy_max13_out.txt
          findstr /c:"The settings step is finished" easy_max13_out.txt
          if errorlevel 1 exit /b 1

      - name: Memory Integrity off (13) is in place after max13 (read-only check)
        shell: powershell
        run: |
          $root = (Get-Location).Path
          $items = & { . (Join-Path $root 'tools\Check_Status.ps1') -Root $root; Invoke-Checks (Join-Path $root 'reg') (Join-Path $env:TEMP 'pcopt_ci_unused_max13'); $script:Items }
          $i13 = @($items | Where-Object { $_.Id -eq '13' }) | Select-Object -First 1
          Write-Host ('13: ' + $i13.Status)
          if ($null -eq $i13 -or $i13.Status -ne 'OK') { exit 1 }

      - name: Easy Setup whole flow (real run, no questions) on this disposable machine
        shell: cmd
        timeout-minutes: 15
        run: |
          rem The runner cannot make a restore point, so the setup must STOP at step 2 and say so (the safe behaviour). On a machine that can, it runs to the summary.
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Easy_Setup.ps1 -Yes -NoPrompt -SkipUpdate -Mode safe > easyfull_out.txt 2>&1 < nul
          type easyfull_out.txt
          findstr /c:"Stopped here" /c:"SUMMARY" easyfull_out.txt
          if errorlevel 1 exit /b 1
          findstr /c:"earlier Easy Setup" /c:"profile_" easyfull_out.txt
          if not errorlevel 1 exit /b 1
          exit /b 0

      - name: The tools in More Tools save their reports in the main Logs folder
        shell: powershell
        run: |
          foreach ($b in '8_PC_Health.bat', 'S_PC_Specs.bat', '5_System_Report.bat') { cmd /c ('"More Tools\' + $b + '" < nul') | Out-Null }
          foreach ($p in 'PCHealth_*.txt', 'PCSpecs_*.txt', 'SystemReport_*.txt') {
            $n = @(Get-ChildItem -Path 'Logs' -Filter $p -ErrorAction SilentlyContinue).Count
            Write-Host ($p + ': ' + $n)
            if ($n -eq 0) { Write-Host ('no report ' + $p + ' in the main Logs folder'); exit 1 }
          }
          if (Test-Path 'More Tools\Logs') { Write-Host 'a Logs folder was made inside More Tools'; exit 1 }

      - name: The Windows app builds and its self-test passes (status script, apply and revert of one tweak)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File app\build.ps1 -Out "$PWD\appout\Win11 Optimizer.exe"
          $p = Start-Process -FilePath "$PWD\appout\Win11 Optimizer.exe" -ArgumentList '--selftest', '--out', "$PWD\appout\selftest.txt", '--root', "$PWD" -Wait -PassThru
          if (Test-Path "$PWD\appout\selftest.txt") { Get-Content "$PWD\appout\selftest.txt" }
          Write-Host ('exit code ' + $p.ExitCode)
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: The Easy Setup report was written while it ran
        if: always()
        shell: powershell
        run: |
          $f = @(Get-ChildItem -Path 'Logs' -Filter 'EasySetup_*.txt' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending)
          Write-Host ('Easy Setup reports in Logs: ' + $f.Count)
          if ($f.Count -eq 0) { Write-Host 'no report was written'; exit 1 }
          Get-Content -LiteralPath $f[0].FullName
          $t = Get-Content -LiteralPath $f[0].FullName -Raw
          if ($t -notmatch 'Step 1 of 10') { Write-Host 'the report has no first step'; exit 1 }
