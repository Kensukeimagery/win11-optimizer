name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Repository checks (version, syntax, labels, undo files, Check Status dry run)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\Test-Repo.ps1

      - name: Lint PowerShell (PSScriptAnalyzer, errors and warnings)
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost,PSUseApprovedVerbs,PSAvoidUsingEmptyCatchBlock,PSUseShouldProcessForStateChangingFunctions,PSAvoidGlobalVars,PSUseSingularNouns,PSAvoidUsingInvokeExpression,PSUseDeclaredVarsMoreThanAssignments,PSReviewUnusedParameter,PSUseBOMForUnicodeEncodedFile
          $r | Format-Table RuleName,Severity,ScriptName,Line,Message -AutoSize -Wrap | Out-String -Width 220
          Write-Host ('findings: ' + @($r).Count)

      - name: Read-only tools run without errors
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Env_Check.ps1 -Human
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\System_Report.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Driver scan runs (scan only, nothing is installed)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Driver_Check.ps1 -SkipUpdateSearch -NoPrompt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Driver cleanup scan runs (list only, nothing is removed)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Driver_Clean.ps1 -NoPrompt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: PC specs page runs (read-only)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\PC_Specs.ps1 -Root .
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: PC health and support bundle run (read-only)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\PC_Health.ps1 -Root .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\Support_Bundle.ps1 -Root .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $b = Get-ChildItem -Filter 'SupportBundle_*.txt' | Select-Object -First 1
          if ($null -eq $b) { Write-Host 'no bundle was written'; exit 1 }
          $t = [IO.File]::ReadAllText($b.FullName)
          foreach ($s in '## Environment', '## Check Status', '## PC specs', '## PC health', '## System report', '## Driver scan') { if (-not $t.Contains($s)) { Write-Host ('missing section ' + $s); exit 1 } }
          if ($t -match [regex]::Escape($env:USERNAME + '\') -or $t.Contains($env:COMPUTERNAME)) { Write-Host 'the bundle still contains the user or computer name'; exit 1 }
          Write-Host ('bundle ok, ' + [math]::Round($b.Length / 1KB) + ' KB')

      - name: Updater install step (success, overwrite, roll back)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\Test-UpdateApply.ps1

      - name: Apply and undo every tweak on this disposable machine
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\Test-RegRoundTrip.ps1

      - name: Main menu starts, revert path works, menu exits
        shell: cmd
        timeout-minutes: 3
        run: |
          call "1_Start_Here - PC_Optimizer_Master (Run as Administrator).bat" < tests\master_input.txt > master_out.txt 2>&1
          type master_out.txt
          findstr /c:"MASTER CONTROL v" master_out.txt
          if errorlevel 1 exit /b 1
          findstr /c:"Reverting with UNDO_15" master_out.txt
          if errorlevel 1 exit /b 1
          findstr /c:"PC HEALTH" master_out.txt
          if errorlevel 1 exit /b 1
          findstr /c:"SUPPORT BUNDLE" master_out.txt
          if errorlevel 1 exit /b 1
          findstr /c:"YOUR PC ON ONE PAGE" master_out.txt
          if errorlevel 1 exit /b 1

      - name: Show what the main menu printed
        if: always()
        shell: cmd
        run: if exist master_out.txt type master_out.txt
